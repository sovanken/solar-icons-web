# Weekly drift check against the Iconify API.
#
# Deliberately not part of ci.yml: it needs the network and depends on data
# we do not control, so an upstream rename would otherwise fail pull
# requests that have nothing to do with it. A failure here emails the repo
# owner, which is the notification we actually want.
name: Upstream check

on:
  schedule:
    # Mondays, 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  categories:
    name: Categories still match Iconify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No npm ci: the check uses only the Node standard library, so
      # installing the app's dependencies would be pure latency.
      - name: Check category names
        run: npm run check:categories

  meanings:
    name: Icon meanings still match Iconify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node 22 for --experimental-strip-types: the check imports
      # lib/icon-meanings.ts directly, without a build step.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fails if a whole-icon entry names an icon Solar no longer has; also
      # lists icons that still have no meaning, for the next sync.
      - name: Check icon meanings
        run: npm run check:meanings
