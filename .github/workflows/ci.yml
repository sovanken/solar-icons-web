name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & checks (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 is the stated baseline in the README (Next.js 16 requires 20+).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches components that are written but never rendered. This repo has
      # shipped three of those; a build cannot catch them, because dead code
      # compiles perfectly well.
      - name: Check for unmounted components
        run: npm run check:unmounted

      # The production build type-checks the whole project, which is the real
      # regression gate here.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
